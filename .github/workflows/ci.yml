name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissão mínima: o CI só lê o código.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Interface (tipos, build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # vue-tsc + vite
      - run: pnpm test
      - run: pnpm audit

  rust-windows:
    name: Rust no Windows (núcleo, CLI e backend da interface)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # O backend do Tauri precisa da pasta `app/dist` (a interface compilada).
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build
        working-directory: app
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-linux:
    name: Rust no Linux (núcleo e CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `iproute2` traz o `ss`, usado pelo detector de mineradores.
      - run: sudo apt-get update && sudo apt-get install -y iproute2
      - run: cargo clippy -p oblivion-core -p oblivion --all-targets -- -D warnings
      - run: cargo test -p oblivion-core -p oblivion

  cargo-audit:
    name: Vulnerabilidades nas dependências Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
